# Shared by backend/ and agent/. Run from the repository root:
#   uv run --project backend ruff check .
line-length = 110
target-version = "py312"
src = ["backend", "agent"]
extend-exclude = ["frontend"]

[lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
  "E501",   # long French UI strings are kept on one line
  "B008",   # FastAPI dependencies are declared as argument defaults
  "RUF001", # typographic apostrophes are intentional in French copy
  "RUF002",
  "RUF003",
  "RUF059", # helpers return tuples; callers unpack positionally and use only part of them
  "C408",   # dict(CallSid=...) mirrors provider form fields in tests
  "SIM105", # an explicit try/except/pass keeps the "why" comment next to the handler
  "SIM108",
]

[lint.per-file-ignores]
"backend/migrations/env.py" = ["E402"] # the app is put on sys.path before it is imported
